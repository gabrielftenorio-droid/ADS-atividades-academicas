<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Tabuada Interativo</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Gerador de Tabuada Interativo</h1>
        <p>Digite um número de 1 a 10 para gerar sua tabuada.</p>

        <label for="numero">Número:</label>
        <input type="number" id="numero" min="1" max="10">

        <button id="gerar">Gerar tabuada</button>

        <div id="resultado" aria-live="polite"></div>
    </main>
</body>
</html>
