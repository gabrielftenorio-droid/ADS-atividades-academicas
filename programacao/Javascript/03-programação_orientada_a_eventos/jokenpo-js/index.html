<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jokenpô</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="jogo-container">
        <h1>Jokenpô</h1>
        <p>Escolha sua jogada:</p>
        <div class="botoes-jogada">
            <button id="pedra" class="btn-jogada">Pedra</button>
            <button id="papel" class="btn-jogada">Papel</button>
            <button id="tesoura" class="btn-jogada">Tesoura</button>
        </div>
        <div class="resultado-area">
            <h2 id="mensagem">Aguardando jogada...</h2>
            <p id="placar">Jogador 0 x 0 Computador</p>
        </div>
        <button id="reiniciar" class="oculto">Jogar Novamente</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
